name: Android voice keyboard

# Builds the offline Android voice keyboard in android-keyboard/ and attaches
# the installable APK to the workflow run. Only runs when that folder changes,
# or when started by hand from the Actions tab.
on:
  push:
    paths:
      - "android-keyboard/**"
      - ".github/workflows/android-keyboard.yml"
  pull_request:
    paths:
      - "android-keyboard/**"
      - ".github/workflows/android-keyboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-keyboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Cache downloaded model and whisper.cpp source
        uses: actions/cache@v4
        with:
          path: android-keyboard/.downloads
          key: android-keyboard-downloads-${{ hashFiles('android-keyboard/app/build.gradle.kts') }}

      # Optional: sign with your own key so each new build installs over the
      # last one. Add these repository secrets to enable it:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Check the app has no internet permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/35.0.0/aapt2)
          "$AAPT" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The APK requests INTERNET permission"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: offline-voice-keyboard-apk
          path: android-keyboard/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
